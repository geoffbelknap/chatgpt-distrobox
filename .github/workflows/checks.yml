name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts
        run: |
          bash -n bootstrap.sh install.sh scripts/install-in-container.sh
          shellcheck bootstrap.sh install.sh scripts/install-in-container.sh
      - name: Test installer and update configuration
        run: python3 -m unittest discover -s tests -v
      - name: Check public signing key fingerprint
        run: |
          fingerprint=$(gpg --batch --with-colons --show-keys keys/openai.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4
